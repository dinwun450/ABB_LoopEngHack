[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-policy-loop"
version = "0.1.0"
description = "Buildkite and LlamaIndex demo for iteratively optimizing credit approval policies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "llama-index-core",
  "llama-index-llms-openai",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["credit_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
